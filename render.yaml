services:
  - type: web
    name: orbit-board-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: SERVER_PORT
        value: "8000"