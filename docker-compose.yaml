services:
  api:
    build: .
    image: orbit-board-api:latest
    container_name: orbit-board-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  test_db:
    image: postgres:17-alpine
    container_name: orbit-board-test-db
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit_test
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  test-db-data:
